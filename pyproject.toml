[project]
name = "science-mcp"
version = "0.1.0"
description = "Local MCP tools for ecosyste.ms Science software metadata"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=2,<3"]

[project.scripts]
science-mcp = "science_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_mcp"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
